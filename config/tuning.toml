# DUO-WARE 2 tuning: every number the software uses that is not a wire format or a car address.
# Rule (CLAUDE.md): no magic numbers in code. Each value has its unit and where it came from.
# "DUO-WARE 1" = measured or used in the old project (context/context.md there).
# Sections for later milestones are added by those milestones, not guessed here.

[markers]
dictionary = "DICT_4X4_50"      # ArUco family; valid IDs 0-49
default_size_mm = 90            # printed black-square side offered when a role is assigned
size_warn_fraction = 0.15       # warn when a tag's measured size differs from its printed size by more (DUO-WARE 1)

[pose]
stale_ms = 300                  # a car pose older than this (by capture time) stops that car (brief 4.2)
stats_window_s = 10             # window for pose-age p50/p95/max on the dashboard

[clock_sync]
# NTP-style exchange on the frames socket (PROTOCOL.md §3).
interval_ms = 500               # normal rate
fast_interval_ms = 100          # rate for the first fast_period_s after a phone connects
fast_period_s = 3
max_rtt_ms = 20                 # samples with a longer round trip are discarded (USB tether RTT is ~1-3 ms)
window_s = 60                   # samples kept for the offset/drift fit
best_fraction = 0.25            # fit uses this fraction of the window with the lowest RTT
unsynced_after_s = 5            # no accepted sample for this long -> camera UNSYNCED -> its poses unusable
# The fitted drift slope is used only when the chosen samples span at least this fraction of window_s; over a shorter
# span the per-sample path asymmetry (~1 ms) outweighs a crystal's ~30 ppm drift (unitless; M1 P6 measurement).
slope_min_span_fraction = 0.25

[localization]
# Anchor fit rules ported from DUO-WARE 1 vision/world.py (1 anchor similarity, 2 affine, >=3 homography+RANSAC).
settle_frames = 10              # steady frames averaged before a fit (DUO-WARE 1)
move_tol_px = 1.5               # anchor corners moving more than this = not steady (DUO-WARE 1)
ransac_threshold_mm = 15        # RANSAC inlier threshold on floor points (DUO-WARE 1)
max_fit_rms_mm = 30             # reject a fit worse than this (DUO-WARE 1)
drift_tol_mm = 20               # locked fit residual above max(this, 3 x fit rms) = MISALIGNED (DUO-WARE 1)
drift_frames = 15               # MISALIGNED this many frames in a row -> refit (DUO-WARE 1)
place_frames = 15               # frames averaged to auto-place an unplaced anchor (DUO-WARE 1)
place_move_tol_mm = 15          # an unplaced anchor moving more than this restarts its averaging (DUO-WARE 1)
# Car tags sit above the floor. Their apparent size over printed size gives the parallax scale
# (DECISIONS.md D13); smoothed with this EMA factor per frame.
parallax_ema = 0.05
parallax_max_scale = 1.25       # ignore apparent/printed ratios above this (bad detection), per frame

[link]
# Server-side measurement of the phone link shown on the dashboard (PROTOCOL.md §6.2 cameras[].link):
# one-way latency p50/p95, RFC 3550 jitter and packet loss over this window.
stats_window_s = 10

[camera]
# Sent to the phone in "welcome"/"settings" (PROTOCOL.md §4.4). The phone reports what it achieved.
# exposure_ms, iso, fps and resolution are defaults: PUT /api/camera-settings and venue presets override them.
resolution = [1280, 720]        # analysis stream size; 80-90 mm tags must stay >= ~25 px wide
fps = 0                         # 0 = the highest the sensor supports at `resolution` (Camera2 min frame duration)
exposure_ms = 3.0               # short exposure is the key feature: blur limited DUO-WARE 1 above 150 px/s at ~26 ms
iso = 800                       # raise if the image is too dark at the short exposure
focus = "locked"                # "locked" = autofocus once on the floor, then lock
awb = "locked"                  # "locked" = auto white balance once, then lock
preview_fps = 3                 # dashboard preview, 0 = off; never on the tracking path
preview_width = 480
preview_jpeg_quality = 60

[phone]
# Region-of-interest tracking on the phone (PROTOCOL.md §4.4 "tracking", DECISIONS.md D32).
full_scan_every = 10            # full-frame scan at least every N frames (3 Hz at 30 fps, 6 Hz at 60 fps)
roi_margin = 1.5                # window grows by this many tag side lengths on every side of the predicted box
roi_min_px = 64                 # smallest window edge (ArUco needs the quiet zone around the tag)
threads = 0                     # detection worker threads; 0 = cores in the fastest CPU cluster
demote_after_scans = 3          # a tag tracked only because it moved is dropped after this many still full scans (D32)
corner_refine = "subpix"        # ArUco corner refinement: "subpix" or "none" (PROTOCOL.md §4.4)
aruco3 = false                  # OpenCV "ArUco 3" fast mode on full scans; off until the M2 benchmark (H7) decides

[phone.thermal]
# Thermal ladder (PROTOCOL.md §4.4, DECISIONS.md D34): scale down before Android throttles on its own.
# Headroom is PowerManager.getThermalHeadroom(forecast_s): 1.0 = the point where throttling starts.
forecast_s = 10
headroom_down = 0.85            # step one level down at or above this forecast
headroom_up = 0.65              # step one level up after up_after_s below this
up_after_s = 60
status_down = 2                 # also step down at thermal status >= this (2 = MODERATE)
fps_steps = [1.0, 0.75, 0.5]    # fraction of the base fps at levels 0, 1, 2
resolution_steps = [[960, 540]] # then smaller resolutions (same aspect ratio as [camera] resolution)
