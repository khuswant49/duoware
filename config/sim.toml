# DUO-WARE 2 simulator scenario: the simulated PHYSICAL world (python -m duoware.sim).
#
# This is ground truth that only the simulator knows. The server never reads this file: it must
# discover everything through the same protocols as with real hardware (DECISIONS.md D14).
# Tag roles are NOT set here either: assign them on the Tags page, or apply the "sim_3x3" venue preset.
#
# Units: mm, degrees clockwise from +x, +y down the map (DECISIONS.md D22).
# Values marked "fitted" were fitted to DUO-WARE 1 recordings; "guess" values wait for M4 hardware data.

[server]
# The simulated phone first listens for the server's discovery beacon (PROTOCOL.md §4.2) for
# discovery_wait_s; without a beacon (or with discovery = false) it uses host and the ports below.
discovery = true
discovery_wait_s = 3
host = "127.0.0.1"
http_port = 8000                # must match config/server.toml [http] port
frames_port = 47801             # must match config/server.toml [udp] frames_port
beacon_port = 47800             # must match config/server.toml [udp] beacon_port
pair_code = ""                  # empty = read DUO_PAIR_CODE from .env / the environment

[world]
# Physical tags lying on the simulated floor: [id, x_mm, y_mm, yaw_deg, size_mm].
# yaw = direction the tag's TOP edge faces; -90 = towards -y (up the map).
# A 3 x 3 road network built to exercise brief 4.6: column spacing 450 / 380 mm and row spacing
# 400 / 480 mm (uneven), the whole grid rotated 8 degrees from the origin tag, a few nodes pushed
# 10-15 mm off line (crooked rows), node tags not square to the grid.
# Tag 10 sits at (0, 0) with yaw -90, so the sim world frame equals the server's floor frame and tests
# can compare positions directly. Use the built-in "sim_3x3" venue preset for the roles.
floor_tags = [
    [10,    0.0,    0.0, -90, 90],   # row 0, col 0  (origin)
    [2,   454.0,   58.0, -83, 90],   # row 0, col 1  (pickup)   pushed off line
    [11,  821.9,  115.5, -80, 90],   # row 0, col 2
    [3,   -55.7,  396.1, -84, 90],   # row 1, col 0  (home)
    [6,   380.0,  471.0, -79, 90],   # row 1, col 1             pushed off line
    [4,   766.3,  511.6, -82, 90],   # row 1, col 2  (drop-off)
    [12, -122.5,  871.4, -85, 90],   # row 2, col 0
    [7,   323.1,  934.1, -81, 90],   # row 2, col 1
    [13,  715.0,  993.0, -82, 90],   # row 2, col 2             pushed off line
]

[camera]
id = 1
device_id = "sim-phone-1"
position_mm = [350, 500, 1800]  # lens position over the middle of the layout; z = height above the floor
tilt_deg = [2.0, -1.5]          # small pitch/roll: a real phone is never perfectly level (guess)
yaw_deg = 1.0                   # rotation of the image about the vertical axis (guess)
resolution = [1280, 720]
hfov_deg = 70                   # horizontal field of view (guess; realme 9 Pro+ main camera not measured)
lens_k1 = -0.03                 # barrel distortion; NOT measured (DUO-WARE 1 used -0.05 as a stand-in)
fps = 30                        # the simulated sensor's maximum at this resolution (reported in hello yuv_sizes)
timestamp_clock = "boottime"    # what the simulated phone reports in status (PROTOCOL.md §3.1, §4.5)

[phone_model]
# How a real phone's detector behaves, applied to the exact projected corners.
corner_noise_px = 0.07          # still-tag corner jitter sd (fitted: DUO-WARE 1 0.05-0.09 px)
# Detection probability vs motion blur length in px (blur = image speed x exposure).
# Fitted from DUO-WARE 1: 100% below 150 px/s, ~73% at 150-300 px/s, ~26% above 300 px/s at ~26 ms exposure.
blur_ok_px = 4.0                # always detected below this
blur_half_px = 7.0              # 50% detected here (linear between points)
blur_zero_px = 12.0             # never detected above this
exposure_ms = 3.0               # initial value; the server's settings message replaces it
link_mode = "wired_tether"      # reported in hello/status when transport = "udp"
# How the simulated phone sends frames and answers sync (PROTOCOL.md §2, §2.1):
#   "udp": datagrams to frames_port, found through the beacon (USB tethering / Wi-Fi).
#   "tcp": like `wired_adb`: finds the server with GET /api/beacon on [server] host (127.0.0.1), reports link.mode
#          "wired_adb" whatever link_mode says, and sends length-prefixed frames on one TCP connection to the
#          frames_tcp_port from `welcome` (a frame is dropped and counted as send_dropped if the last write has not
#          drained). Packet loss in [network] does not apply: TCP does not lose packets.
transport = "udp"
# ROI emulation: the sim follows settings.tracking (track_ids, full_scan_every) and marks frames
# "full" or "roi" like the real app, so the server's handling of roi frames is tested.
# Values the sim does not model (CPU load, thermal headroom) are reported as null, never invented.
pipeline_ms = [45, 15]          # capture -> frame available to the app: mean, +- uniform (guess, measure in M2)
detect_ms = [15, 5]             # detection time: mean, +- uniform (guess)
clock_offset_s = 12345.678      # phone clock minus server clock (arbitrary; sync must find it)
clock_drift_ppm = 30            # phone clock runs this much fast (guess; typical crystal)

[network]
# Phone -> server UDP path.
delay_ms = [2, 1]               # mean, +- uniform. USB tether ~1-3 ms (guess, measure in M2)
drop_fraction = 0.01            # random packet loss
burst_drop_every_s = 20         # every N s, lose burst_drop_ms of packets (WiFi hiccup model); 0 = off
burst_drop_ms = 250

[[car]]
name = "DUO-A"                  # must match config/cars.toml; the sim car answers ID with this name
tag = 1                         # physical tag on the car (roles are still assigned on the Tags page)
tag_size_mm = 80
tag_height_mm = 80              # tag above the floor: gives real parallax in the simulated image
tag_offset_mm = [30, 0]         # tag centre from the axle midpoint in the car frame [forward, left] (guess)
start = [0, 0, 7]               # x, y, heading: on node 10, facing node 2
tcp_port = 47811                # the server's sim transport connects here (PROTOCOL.md §5 over TCP)
wheel_base_mm = 130             # guess; the real cars are not measured
max_speed_mm_s = 450            # wheel speed at PWM 255 (guess)
dead_zone_pwm = 85              # |PWM| below this does not turn the wheel (DUO-WARE 1 min_pwm)
right_gain = 0.93               # right wheel speed / left wheel speed at equal PWM (asymmetry, guess)
time_constant_ms = 80           # first-order spin-up / coast lag (guess)
link_delay_ms = [20, 10]        # command reaches the car after mean +- uniform (guess: ESP32 SPP)

[[car]]
name = "DUO-B"
tag = 5
tag_size_mm = 80
tag_height_mm = 90
tag_offset_mm = [0, 0]
start = [-122.5, 871.4, 8]      # on node 12, facing node 7
tcp_port = 47812
wheel_base_mm = 140
max_speed_mm_s = 380
dead_zone_pwm = 100
right_gain = 1.08
time_constant_ms = 110
link_delay_ms = [30, 15]        # guess: HC-05 is slower than the ESP32

[script]
# M1 only: with no controller yet, the simulated cars follow these loops by themselves so the map
# and pose-age statistics have something moving. Removed once the server drives the sim cars (M3).
enabled = true
speed_mm_s = 150
turn_deg_s = 90

  [script.routes]
  # Per car name: floor tag IDs driven to in a loop (back and forth), turning in place at each.
  # The two routes never share a node, because nothing coordinates the cars before M6.
  DUO-A = [10, 2, 11, 2]
  DUO-B = [12, 7, 13, 7]
